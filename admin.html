<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Administration · NEXORA STUDIO</title>
<style>
:root{--iv:#F7F6F2;--bl:#4965FF;--bp:#243B9B;--lv:#B8B9FF;--an:#20232B;--gr:#5F6371}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(900px 500px at 90% -10%,#b8b9ff66,transparent),var(--iv);color:var(--an);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{margin:0 0 .5em;letter-spacing:-.02em}.wrap{max-width:980px;margin:auto;padding:16px}
.card{background:#ffffffc0;backdrop-filter:blur(10px);border:1px solid #20232b1a;border-radius:16px;padding:16px;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--gr);margin:10px 0 0}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #20232b33;border-radius:10px;background:#fff;color:var(--an)}textarea{min-height:70px}input[type=checkbox]{width:auto}input[type=color]{height:44px;padding:3px}
button,.b{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;background:var(--bl);color:#fff;text-decoration:none;display:inline-block}
button.o,.b.o{background:transparent;color:var(--bp);border:1px solid var(--bp)}button.r{background:#b3261e}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--lv);outline-offset:2px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0}nav button{background:#fff;color:var(--an);border:1px solid #20232b1a;white-space:nowrap}nav button[aria-current=true]{background:var(--bp);color:#fff}
.top,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.big{font-size:2.4rem;font-weight:700;color:var(--bl);line-height:1}.mu{color:var(--gr);font-size:.9rem}.tag{font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--lv);color:var(--bp)}
#msg{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;padding:12px 16px;border-radius:12px;color:#fff;max-width:600px;margin:auto}#msg.ok{background:var(--bp)}#msg.bad{background:#b3261e}
img.t{height:64px;border-radius:8px;object-fit:cover;background:#fff}.th{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}summary{cursor:pointer;font-weight:600}
.lg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}.mc{background:#fff;border:1px solid #20232b1a;border-radius:12px;padding:8px}
.mc img,.mc .vi{width:100%;height:90px;object-fit:cover;border-radius:8px;background:#eef;display:grid;place-items:center}.mc p{font-size:.75rem;word-break:break-all;margin:4px 0}.mc button{padding:6px 12px;font-size:.8rem}
#pg{position:fixed;right:12px;top:12px;z-index:60;width:min(320px,calc(100% - 24px));background:#fff;border-radius:12px;padding:8px;box-shadow:0 10px 40px #0003}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.8rem;margin:4px 0}.pr progress{grid-column:1/-1;width:100%}.pr.bad{color:#b3261e}
dialog{width:min(760px,94vw);max-height:86vh;border:0;border-radius:16px;padding:16px}dialog::backdrop{background:#20232b88}
.npd{margin:10px auto;background:#111;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 36px #0003;max-width:100%}
.npd.m{border-radius:30px;background:#16161c}
.npb{flex:none;height:26px;background:#25252e;display:flex;align-items:center;gap:5px;padding:0 10px}.npb i{width:8px;height:8px;border-radius:50%;background:#666}.npd.m .npb{display:none}
.ns{flex:1;position:relative;overflow:hidden;background:#fff}.npd.m .ns{border-radius:22px}
.ns iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.nl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:16px;background:#fffe;font-size:.85rem}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #20232b33;border-top-color:var(--bl);border-radius:50%;animation:spn .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spn{to{transform:rotate(360deg)}}
.rp{font-size:.82rem;margin:8px 0;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid #20232b1a;overflow-wrap:anywhere}.rp.bad{border-color:#b3261e;color:#b3261e}.rp.ok{border-color:#2e7d32;color:#1b5e20}
button:disabled{cursor:not-allowed}
</style></head><body>
<div id="msg" role="status" hidden></div><div id="pg" hidden></div>
<dialog id="dlg"><div class="top"><h2>Bibliothèque</h2><button class="o" type="button" id="dx">Fermer</button></div><input id="dq" type="search" placeholder="Rechercher un média" aria-label="Rechercher"><div class="lg2" id="dg"></div></dialog>
<main class="wrap">
<section id="login" hidden><div class="card" style="max-width:420px;margin:12vh auto 0"><h1>NEXORA STUDIO</h1><p class="mu">Espace administrateur</p>
<form id="lf"><label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required>
<p><button type="submit">Se connecter</button></p></form></div></section>
<section id="app" hidden>
<div class="top"><h1>Administration</h1><div class="row"><a class="b o" href="index.html?preview=1" target="_blank" rel="noopener">Prévisualiser</a><button id="pub" type="button">Publier le site</button><button class="o" id="out" type="button">Déconnexion</button></div></div>
<nav id="tabs"><button data-t="dash">Tableau de bord</button><button data-t="projs">Réalisations</button><button data-t="lib">Médias</button><button data-t="txt">Textes</button><button data-t="price">Tarifs</button><button data-t="look">Apparence</button><button data-t="leads">Demandes</button></nav>
<div id="v"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const C=window.NEXORA_CONFIG||{};let sb,rows=[],LIB=[],HASDOC=false,HASPRES=false,HASBK=false;
const say=(t,bad)=>{const n=$("#msg");n.textContent=t;n.className=bad?"bad":"ok";n.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>n.hidden=true,6000)};
const view=v=>{$("#login").hidden=v!=="login";$("#app").hidden=v!=="app"};
const fmt=d=>d?new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"";
const ST={nouveau:"Nouveau",en_cours:"En cours",repondu:"Répondu",termine:"Terminé"},FD=["logos","fonds","sections","projets","galerie","videos","divers"];
const PF=[["name","Nom du projet","text"],["client_name","Nom du client","text"],["sector","Secteur d’activité","text"],["category","Catégorie","text"],["completed_on","Date de réalisation","date"],["description","Description","a"],["problem","Problématique du client","a"],["intervention","Notre intervention","a"],["features","Fonctionnalités (une par ligne)","a"],["site_url","URL du site réalisé","url"],["local_doc","Aperçu local · code HTML de la création (laisser vide si non utilisé)","a"]];
const pf=()=>HASDOC?PF:PF.filter(x=>x[0]!=="local_doc");
const PM=[["cover_url","Image principale","projets"],["logo_url","Logo du client","logos"],["desktop_shot","Capture ordinateur — s’affiche dans l’aperçu","projets"],["mobile_shot","Capture mobile — s’affiche dans l’aperçu","projets"]];
const AC=[["color_bg","Fond (sombre)","#07070B"],["color_ink","Texte principal (clair)","#F4F3F0"],["color_blue","Accent vif","#FFFFFF"],["color_deep","Gris moyen","#A8A8B4"],["color_lav","Gris clair","#D6D6DE"]];
const AI=[["logo_url","Logo du site (en-tête et pied de page)","logos"],["img_hero","Image de fond de l’accueil","fonds"],["img_vision","Image · Notre vision","sections"],["img_expertises","Image · Expertises","sections"],["img_pourquoi","Image · Pourquoi NEXORA","sections"],["img_contact","Image · Contact","sections"]];
const CK=[["contact_email","Coordonnées › Adresse e-mail"],["contact_tel","Coordonnées › Téléphone"],["contact_address","Coordonnées › Adresse postale"],["social_instagram","Réseaux sociaux › Instagram (URL https)"],["social_linkedin","Réseaux sociaux › LinkedIn (URL https)"],["social_facebook","Réseaux sociaux › Facebook (URL https)"],["legal_url","Pied de page › Lien Mentions légales externe — facultatif, remplace la fenêtre intégrée (URL https)"],["privacy_url","Pied de page › Lien Confidentialité externe — facultatif, remplace la fenêtre intégrée (URL https)"]];

/* ===== Session ===== */
async function enter(){const{data:{session}}=await sb.auth.getSession();if(!session)return view("login");
 const{data,error}=await sb.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();view("login");return say("Ce compte n’a pas les droits administrateur.",1)}
 view("app");
 const t=await sb.from("projects").select("local_doc").limit(1);HASDOC=!t.error;
 const t2=await sb.from("projects").select("presentation,import_path,preview_meta").limit(1);HASPRES=!t2.error;
 const t3=await sb.storage.from(PB).list("",{limit:1});HASBK=!t3.error;
 go("dash")}
$("#lf").onsubmit=async e=>{e.preventDefault();if(!sb)return say("config.js n’est pas renseigné (URL et clé Supabase).",1);const b=e.submitter;b.disabled=true;
 const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});b.disabled=false;
 if(error)return say("Connexion impossible : "+error.message,1);$("#pw").value="";enter()};
$("#out").onclick=async()=>{await sb.auth.signOut();view("login")};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b)go(b.dataset.t)};
function go(t){const PF0=$("#pf");if(PF0&&PF0._imp&&PF0._imp.pending&&!PF0._saved)dropPkg(PF0._imp.prefix);document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===t));({dash,projs,lib,txt,price,look,leads})[t]().catch(e=>say("Erreur : "+e.message,1))}

/* ===== Import avec progression ===== */
const chkF=f=>{const i=f.type.startsWith("image/"),v=f.type.startsWith("video/");if(!i&&!v)return"format non pris en charge (images JPEG, PNG, WebP, GIF, SVG ou vidéos MP4, WebM)";if(i&&f.size>10485760)return"image supérieure à 10 Mo";if(v&&f.size>52428800)return"vidéo supérieure à 50 Mo";return""};
function xup(file,path,up,fn,bk){return new Promise(async(ok,ko)=>{const{data:{session}}=await sb.auth.getSession();if(!session)return ko(new Error("session expirée, reconnectez-vous"));
 const x=new XMLHttpRequest();x.open("POST",`${C.SUPABASE_URL}/storage/v1/object/${bk||"site-assets"}/${path.split("/").map(encodeURIComponent).join("/")}`);
 x.setRequestHeader("apikey",C.SUPABASE_ANON_KEY);x.setRequestHeader("Authorization","Bearer "+session.access_token);x.setRequestHeader("x-upsert",up?"true":"false");x.setRequestHeader("cache-control",bk?"max-age=31536000":"max-age=300");x.setRequestHeader("Content-Type",file.type);
 x.upload.onprogress=e=>e.lengthComputable&&fn(e.loaded/e.total);
 x.onload=()=>{if(x.status<300)ok();else{let m="";try{m=JSON.parse(x.responseText).message}catch(_){}ko(new Error(m||"erreur "+x.status))}};x.onerror=()=>ko(new Error("réseau indisponible"));x.send(file)})}
async function upl(files,folder,rep){const box=$("#pg");box.innerHTML="";box.hidden=false;
 const res=await Promise.all([...files].map(async f=>{const r=document.createElement("div");r.className="pr";r.innerHTML=`<span>${esc(f.name)}</span><em></em><progress max="1" value="0"></progress>`;box.append(r);const pg=r.querySelector("progress"),em=r.querySelector("em");
  try{const e=chkF(f);if(e)throw new Error(e);const p=rep||folder+"/"+Date.now().toString(36)+"-"+f.name.toLowerCase().replace(/[^a-z0-9.]+/g,"-").slice(-60);
   await xup(f,p,!!rep,v=>pg.value=v);pg.value=1;em.textContent="✓";return sb.storage.from("site-assets").getPublicUrl(p).data.publicUrl}
  catch(x){em.textContent="Échec";r.classList.add("bad");r.firstChild.textContent+=" : "+x.message;return null}}));
 setTimeout(()=>{box.querySelectorAll(".pr:not(.bad)").forEach(r=>r.remove());if(!box.children.length)box.hidden=true},2500);return res}
const fi=(acc,multi)=>new Promise(r=>{const i=document.createElement("input");i.type="file";i.accept=acc;i.multiple=!!multi;i.onchange=()=>r([...i.files]);i.click()});

/* ===== Bibliothèque ===== */
async function loadLib(){const r=await Promise.all(FD.map(f=>sb.storage.from("site-assets").list(f,{limit:200,sortBy:{column:"created_at",order:"desc"}})));
 const e=r.find(x=>x.error);if(e)throw e.error;
 LIB=r.flatMap((x,i)=>x.data.filter(o=>o.id).map(o=>({folder:FD[i],path:FD[i]+"/"+o.name,name:o.name.replace(/^[a-z0-9]+-/,""),size:o.metadata?.size,type:o.metadata?.mimetype||"",url:sb.storage.from("site-assets").getPublicUrl(FD[i]+"/"+o.name).data.publicUrl})))}
const isV=m=>m.type.startsWith("video");
const mc=(m,pk)=>`<div class="mc">${isV(m)?'<div class="vi">Vidéo</div>':`<img src="${esc(m.url)}" alt="" loading="lazy">`}<p>${esc(m.name)}<br><span class="mu">${esc(m.folder)}${m.size?" · "+Math.round(m.size/1024)+" Ko":""}</span></p>${pk?`<button type="button" data-pk="${esc(m.url)}">Choisir</button>`:`<div class="row"><button class="o" data-a="mrep" data-p="${esc(m.path)}">Remplacer</button><button class="r" data-a="mdel" data-p="${esc(m.path)}">Supprimer</button></div>`}</div>`;
async function lib(){await loadLib();
 $("#v").innerHTML=`<div class="card"><h2>Importer des médias</h2><label>Dossier<select id="fo">${FD.map(f=>`<option>${f}</option>`).join("")}</select></label><label>Fichiers (sélection multiple)<input id="fiu" type="file" multiple accept="image/*,video/*"></label><div class="lg2" id="pv2"></div><p><button data-a="go" id="go" disabled>Importer</button></p></div>
 <div class="card"><h2>Bibliothèque (${LIB.length})</h2><div class="row"><input id="q" type="search" placeholder="Rechercher un média" aria-label="Rechercher" style="flex:1"><select id="ff" style="width:auto"><option value="">Tous les dossiers</option>${FD.map(f=>`<option>${f}</option>`).join("")}</select></div><div class="lg2" id="lb"></div></div>`;drawLib()}
function drawLib(){const q=($("#q").value||"").toLowerCase(),f=$("#ff").value;$("#lb").innerHTML=LIB.filter(m=>(!f||m.folder===f)&&m.name.includes(q)).map(m=>mc(m)).join("")||'<p class="mu">Aucun média.</p>'}
function pick(vid){return new Promise(async res=>{const d=$("#dlg");if(!LIB.length)await loadLib();let q="";
 const draw=()=>{$("#dg").innerHTML=LIB.filter(m=>(vid?isV(m):!isV(m))&&m.name.includes(q)).map(m=>mc(m,1)).join("")||'<p class="mu">Aucun média. Importez-en dans l’onglet Médias.</p>'};
 $("#dq").value="";$("#dq").oninput=e=>{q=e.target.value.toLowerCase();draw()};draw();d.returnValue="";
 d.onclick=e=>{const b=e.target.closest("[data-pk]");if(b)d.close(b.dataset.pk);else if(e.target===d||e.target.id==="dx")d.close("")};d.onclose=()=>res(d.returnValue||null);d.showModal()})}
const mf=(n,l,v,f,vid)=>`<div class="mf" data-n="${n}" data-l="${esc(l)}" data-f="${f}" data-v="${vid?1:0}"><label>${l}</label><input type="hidden" name="${n}" value="${esc(v)}"><div class="th">${v?(vid?'<span class="tag">Vidéo choisie</span>':`<img class="t" src="${esc(v)}" alt="">`):""}</div><div class="row"><button type="button" class="o" data-a="mfi">Importer</button><button type="button" class="o" data-a="mfp">Bibliothèque</button>${v?'<button type="button" class="o" data-a="mfc">Retirer</button>':""}</div></div>`;
const mfSet=(d,u)=>{d.outerHTML=mf(d.dataset.n,d.dataset.l,u,d.dataset.f,d.dataset.v==="1")};

/* ===== Réalisations ===== */
async function projs(){const{data,error}=await sb.from("projects").select("*").order("position").order("created_at");if(error)throw error;rows=data;
 $("#v").innerHTML=`<p><button data-a="new">Ajouter un projet</button></p>`+(rows.map((p,i)=>`<div class="card"><div class="row"><strong>${esc(p.name)}</strong><span class="tag">${p.status==="publie"?"Publié":"Brouillon"}</span>${p.is_concept?'<span class="tag">Concept NEXORA</span>':""}${p.import_path?'<span class="tag">Site importé</span>':p.site_url?'<span class="tag">URL</span>':""}</div>
 <div class="row" style="margin-top:8px"><button class="o" data-a="edit" data-i="${i}">Modifier</button><button class="o" data-a="tog" data-i="${i}">${p.status==="publie"?"Dépublier":"Publier"}</button><button class="o" data-a="up" data-i="${i}" aria-label="Monter" ${i?"":"disabled"}>↑</button><button class="o" data-a="dn" data-i="${i}" aria-label="Descendre" ${i<rows.length-1?"":"disabled"}>↓</button><a class="b o" href="index.html?preview=1#realisations" target="_blank" rel="noopener">Aperçu</a><button class="r" data-a="del" data-i="${i}">Supprimer</button></div></div>`).join("")||'<div class="card mu">Aucune réalisation. Ajoutez votre premier projet.</div>')}
function form(p){p=p||{is_concept:true,status:"brouillon",features:[],gallery:[]};
 $("#v").innerHTML=`<form id="pf" class="card"><h2>${p.id?"Modifier":"Ajouter"} un projet</h2>
 ${presCard(p)}${pf().filter(x=>x[0]!=="site_url").map(([k,l,t])=>`<label>${l}${t==="a"?`<textarea name="${k}"${k==="local_doc"?' rows="12" spellcheck="false" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:220px"':""}>${esc(k==="features"?(p.features||[]).join("\n"):p[k])}</textarea>`:`<input name="${k}" type="${t}" value="${esc(p[k])}">`}</label>`).join("")}
 ${HASDOC?'<p class="mu">Collez ici le code HTML complet de votre création : il s’affiche dans l’aperçu de la section Réalisations, en format ordinateur comme en format mobile. Prioritaire sur l’URL et les captures.</p><div class="row"><button type="button" class="o" data-a="pvd">Aperçu ordinateur</button><button type="button" class="o" data-a="pvm">Aperçu mobile</button><button type="button" class="o" data-a="pvx">Masquer</button></div><div id="lp"></div>':'<p class="mu">Aperçu local indisponible : la colonne <code>local_doc</code> n’existe pas encore dans la table <code>projects</code>. Exécutez le script SQL fourni, puis rechargez cette page.</p>'}
 ${PM.map(([k,l,f])=>mf(k,l,p[k]||"",f)).join("")}${mf("video_url","Vidéo de présentation — s’affiche dans l’aperçu (MP4 ou WebM, 50 Mo max)",p.video_url||"","videos",1)}
 <label>Galerie de photos — diaporama de l’aperçu, si aucune capture n’est fournie</label><div class="th" id="gl"></div><div class="row"><button type="button" class="o" data-a="ga">Importer des photos</button><button type="button" class="o" data-a="gp">Depuis la bibliothèque</button></div>
 <label><input type="checkbox" name="is_concept" ${p.is_concept?"checked":""}> Concept NEXORA (non livré à un client)</label>
 <label>Ordre d’affichage (1 = premier)<input name="pos" type="number" min="1" step="1" value="${p.id?(p.position||0)+1:rows.length+1}"></label>
  <label>État<select name="status"><option value="brouillon" ${p.status==="brouillon"?"selected":""}>Masqué (brouillon)</option><option value="publie" ${p.status==="publie"?"selected":""}>Publié</option></select></label>
 <p class="row"><button type="submit">Enregistrer</button><button type="button" class="o" data-a="back">Annuler</button></p><p id="fs" class="mu" role="status"></p></form>`;
 const F=$("#pf");F._p=p;F._g=[...(p.gallery||[])];gal(F);initPres(F,p)}
const gal=F=>$("#gl").innerHTML=F._g.map((u,i)=>`<span><img class="t" src="${esc(u)}" alt=""><br><button type="button" class="o" data-a="rg" data-k="${i}">Retirer</button></span>`).join("");
async function save(F){const p=F._p,fd=new FormData(F),s=$("#fs"),b=F.querySelector("[type=submit]");b.disabled=true;
 try{const o={};for(const[k,,t]of pf()){const v=(fd.get(k)||"").trim();o[k]=k==="features"?v.split("\n").map(x=>x.trim()).filter(Boolean):(v||null)}
  if(!o.name)throw new Error("Le nom du projet est obligatoire.");if(o.site_url&&!/^https?:\/\//.test(o.site_url))throw new Error("L’adresse du site doit commencer par https://");
  for(const[k]of[...PM,["video_url"]])o[k]=fd.get(k)||null;o.gallery=F._g;o.is_concept=F.is_concept.checked;o.status=fd.get("status");s.textContent="Enregistrement…";let r;
  const ps=parseInt(fd.get("pos"),10);
   if(HASPRES){o.presentation=fd.get("presentation")||"auto";o.import_path=F._imp?F._imp.prefix:null;o.preview_meta=Object.assign({},F._meta||{},F._imp?F._imp.meta:{});
    if(o.presentation==="import"&&!o.import_path)throw new Error("Importez un dossier ou un ZIP, ou changez le type de présentation.");
    if(o.presentation==="url"&&!o.site_url)throw new Error("Renseignez l’URL du site pour ce type de présentation.")}
   if(p.id){if(ps>0)o.position=ps-1;r=await sb.from("projects").update(o).eq("id",p.id)}else{o.position=ps>0?ps-1:(rows.length?Math.max(...rows.map(x=>x.position))+1:0);r=await sb.from("projects").insert(o)}
  if(r.error)throw r.error;F._saved=1;if(HASPRES&&p.import_path&&p.import_path!==o.import_path)await dropPkg(p.import_path);say("Projet enregistré.");projs()}catch(e){s.textContent="Échec : "+e.message;say("Échec : "+e.message,1);b.disabled=false}}

/* 1) lecture : dossier (webkitRelativePath) ou ZIP ; racine = dossier contenant index.html */
async function readSrc(fl){const MAXF=600,MAXB=80*1048576;let L=[];const W=[];

/* 3) contrôle des ressources référencées (HTML + CSS) : introuvables, chemins absolus, http://, pages secondaires */
async function check(G,entry){const M=[],H=[],P=new Set(),X=new Set();

  if(/^(https?:)?\/\//i.test(r)){try{X.add(new URL(r,"https://x").hostname)}catch(_){}if(/^http:/i.test(r))H.push(r);return}
  if(r[0]==="/"){M.push(r+" (chemin absolu depuis la racine : utilisez un chemin relatif)");return}

async function pvRender(m,force){const F=$("#pf");if(!F||!F.presentation)return;m=m||F._pm||"d";F._pm=m;const box=$("#npv"),st=$("#nps"),pr=force||F.presentation.value,url=(F.site_url.value||"").trim(),imp=F._imp&&F._imp.prefix;

 const f=$("iframe",box),nl=()=>$(".nl",box),t0=performance.now();st.innerHTML="";
 if(useUrl){f.onload=()=>{if(tk!==F._tk)return;clearTimeout(F._pt);nl()&&nl().remove();const s=F._meta&&F._meta.embed;
   st.innerHTML=`<div class="rp">${so?"<em>Même domaine que NEXORA : le site est affiché isolé (sans stockage local) pour protéger votre session.</em><br>":""}Le site a répondu en ${((performance.now()-t0)/1000).toFixed(1)} s. S’affiche-t-il correctement dans l’aperçu ?${s==="ok"?" <strong>(confirmé)</strong>":s==="blocked"?" <strong>(marqué comme refusé)</strong>":""}<div class="row" style="margin-top:6px"><button type="button" data-a="emb1">Oui, il s’affiche</button><button type="button" class="o" data-a="emb0">Non : écran vide ou refusé</button></div></div>`};
  F._pt=setTimeout(()=>{if(tk===F._tk&&nl())nl().innerHTML='<span>Aucune réponse après 12 s.<br>Site lent ou injoignable, ou intégration refusée (X-Frame-Options / CSP). Utilisez « Non » ci-dessous si l’écran reste vide.</span>'},12000);f.src=url;return}
